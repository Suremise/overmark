[package]
name = "overmark-win"
description = "Overmark's Windows layer: overlay windows, capture, hotkeys, pointer input, tray."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
overmark-core.workspace = true

[target.'cfg(windows)'.dependencies]
# RegisterHotKey, never a hook.
global-hotkey.workspace = true
# Saves (PNG, JPG) and the clipboard.
image.workspace = true
arboard.workspace = true
tiny-skia.workspace = true
kurbo.workspace = true
# The toolbar's window answers screen readers.
accesskit.workspace = true
accesskit_windows.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The ink-layer spike (examples/ink_spike.rs) draws with tiny-skia, as overmark-core will.
[target.'cfg(windows)'.dev-dependencies]
tiny-skia.workspace = true
tempfile.workspace = true

[lints]
workspace = true
