name: CI

on:
  push:
    branches: [main]
    # A push or pull request that changes only these files skips CI: none of them is built,
    # embedded or read by a test. Kept in on purpose: LICENSE (build.rs reads it),
    # THIRD-PARTY-NOTICES.txt (compiled into the Settings window), docs/settings.example.toml
    # (a test checks it is current), assets/icon, assets/tray and assets/export.py (the icons
    # are compiled in), and .github/workflows (CI must run on its own changes).
    paths-ignore: &docs-only
      - README.md
      - CHANGELOG.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - AGENTS.md
      - CLAUDE.md
      - docs/*.md
      - docs/screenshots/**
      - assets/README.md
      - assets/overmark-demo.gif
      - assets/preview.png
      - .github/ISSUE_TEMPLATE/**
      - .github/pull_request_template.md
  pull_request:
    paths-ignore: *docs-only
  # Run by hand (Actions > CI > Run workflow).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (fmt, clippy, test, deny, release build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml picks the pinned toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      # Checks clean-build.ps1 in a throwaway workspace: it never touches dist, ui-shots or a junction.
      # In a child pwsh, so its exit code is the step's: the script's own last child run is one it
      # expects to fail, which leaves LASTEXITCODE at 1 in the step's session.
      - name: Clean-build script
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-clean-build.ps1
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Test
        run: cargo nextest run --workspace --profile ci --no-tests=warn
      # nextest doesn't run doc tests.
      - name: Doc tests
        run: cargo test --workspace --doc
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licences, advisories, sources
        run: cargo deny check
      - name: Release build
        run: cargo build --workspace --release

  core-platform-free:
    name: Linux (overmark-core is platform-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Test overmark-core
        run: cargo test -p overmark-core
